<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Live Pro Control</title>
    <style>
      :root {
        --bg-color: #05070a;
        --accent-blue: #4285f4;
      }

      body {
        margin: 0;
        background-color: var(--bg-color);
        color: white;
        font-family: -apple-system, system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 画布容器 */
      #geminiCanvas {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80%;
        filter: blur(25px) contrast(1.1);
        z-index: 1;
      }

      /* 顶部控制面板 */
      .controls {
        position: relative;
        z-index: 100;
        margin-top: 40px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        padding: 20px 30px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      input[type='range'] {
        cursor: pointer;
        width: 150px;
      }

      /* 底部 UI */
      .ui-footer {
        position: absolute;
        bottom: 40px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .status-pill {
        background: rgba(16, 20, 28, 0.8);
        backdrop-filter: blur(20px);
        padding: 12px 28px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #00ffcc;
        border-radius: 50%;
        box-shadow: 0 0 10px #00ffcc;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div class="control-group">
        <label>波动高度 (Height)</label>
        <input type="range" id="heightCtrl" min="20" max="250" value="100" />
      </div>
      <div class="control-group">
        <label>动画速度 (Speed)</label>
        <input type="range" id="speedCtrl" min="1" max="10" value="4" />
      </div>
    </div>

    <canvas id="geminiCanvas"></canvas>

    <div class="ui-footer">
      <div class="status-pill">
        <div class="dot"></div>
        <span>Gemini Live · 动态控制模式</span>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('geminiCanvas')
      const ctx = canvas.getContext('2d')
      const heightCtrl = document.getElementById('heightCtrl')
      const speedCtrl = document.getElementById('speedCtrl')

      let width, height
      function resize() {
        width = canvas.width = window.innerWidth
        height = canvas.height = window.innerHeight * 0.8
      }
      window.addEventListener('resize', resize)
      resize()

      // 优化的颜色：更高的饱和度和亮度
      const waveConfigs = [
        {
          y: 0.6,
          length: 0.004,
          amplitude: 100,
          speed: 0.01,
          color: 'rgba(66, 133, 244, 0.8)', // 明亮蓝
          offset: 0,
        },
        {
          y: 0.65,
          length: 0.006,
          amplitude: 80,
          speed: -0.008,
          color: 'rgba(161, 66, 244, 0.7)', // 鲜艳紫
          offset: 100,
        },
        {
          y: 0.7,
          length: 0.005,
          amplitude: 120,
          speed: 0.012,
          color: 'rgba(0, 255, 230, 0.6)', // 明亮青
          offset: 200,
        },
      ]

      let time = 0

      function animate() {
        ctx.clearRect(0, 0, width, height)

        // 获取实时控制参数
        const globalAmp = parseInt(heightCtrl.value)
        const globalSpeed = parseInt(speedCtrl.value) * 0.005

        time += globalSpeed

        // 设置混合模式，让颜色交汇处“发光”
        ctx.globalCompositeOperation = 'screen'

        waveConfigs.forEach((config, i) => {
          ctx.beginPath()

          // 增强的垂直渐变
          const gradient = ctx.createLinearGradient(
            0,
            height * config.y - globalAmp,
            0,
            height
          )
          gradient.addColorStop(0, config.color)
          gradient.addColorStop(0.6, config.color.replace('0.', '0.1')) // 中段淡出
          gradient.addColorStop(1, 'rgba(5, 7, 10, 0)') // 底部彻底融入背景

          ctx.fillStyle = gradient

          for (let x = 0; x <= width; x += 2) {
            // 多层波形合成：基础波 + 谐波
            const baseWave = Math.sin(x * config.length + time + config.offset)
            const harmonic = Math.sin(x * config.length * 0.5 + time * 0.5)

            // 最终 Y 坐标计算
            const y =
              height * config.y + (baseWave + harmonic * 0.5) * globalAmp

            if (x === 0) ctx.moveTo(x, y)
            else ctx.lineTo(x, y)
          }

          ctx.lineTo(width, height)
          ctx.lineTo(0, height)
          ctx.fill()
        })

        requestAnimationFrame(animate)
      }

      animate()
    </script>
  </body>
</html>
