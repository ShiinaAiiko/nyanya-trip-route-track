<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>隐私围栏绘制工具</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Leaflet Draw CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      #map {
        height: 100vh;
        width: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      button {
        margin: 5px;
        padding: 8px 12px;
        cursor: pointer;
      }
      #coordinates {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 5px;
        max-height: 200px;
        overflow-y: auto;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <button id="draw">绘制隐私围栏</button>
      <button id="edit">编辑围栏</button>
      <button id="delete">删除围栏</button>
      <button id="save">保存围栏</button>
    </div>
    <div id="coordinates"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw JS -->
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
      // 初始化地图
      const map = L.map('map').setView([39.9042, 116.4074], 12) // 默认北京中心

      // 添加OpenStreetMap底图
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map)

      // 创建要素组来存储围栏
      const drawnItems = new L.FeatureGroup()
      map.addLayer(drawnItems)

      // 初始化绘制控件
      const drawControl = new L.Control.Draw({
        draw: {
          polygon: {
            title: '绘制隐私围栏',
            allowIntersection: false, // 禁止自相交
            shapeOptions: {
              color: '#d62728', // 红色边框
              fillColor: '#d62728', // 红色填充
              fillOpacity: 0.3, // 半透明
              weight: 2,
            },
            showArea: true, // 显示面积
            metric: true, // 使用公制单位
          },
          polyline: false, // 禁用折线
          circle: false, // 禁用圆形
          rectangle: false, // 禁用矩形
          marker: false, // 禁用标记
        },
        edit: {
          featureGroup: drawnItems, // 可编辑的要素组
        },
      })

      // 添加绘制控件到地图
      map.addControl(drawControl)

      // 监听绘制完成事件
      map.on(L.Draw.Event.CREATED, function (e) {
        const type = e.layerType
        const layer = e.layer

        if (type === 'polygon') {
          // 计算面积（平方米）
          const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0])

          // 面积至少1000平方米
          if (area < 1000) {
            alert('隐私围栏面积不能小于1000平方米')
            return
          }

          // 添加面积信息到弹出窗口
          layer.bindPopup(`隐私围栏 (面积: ${area.toFixed(0)} m²)`)
          drawnItems.addLayer(layer)
          updateCoordinates()
        }
      })

      // 监听编辑事件
      map.on(L.Draw.Event.EDITED, function (e) {
        updateCoordinates()
      })

      // 监听删除事件
      map.on(L.Draw.Event.DELETED, function (e) {
        updateCoordinates()
      })

      // 手动控制按钮
      document.getElementById('draw').addEventListener('click', function () {
        new L.Draw.Polygon(map, drawControl.options.draw.polygon).enable()
      })

      document.getElementById('edit').addEventListener('click', function () {
        drawControl._toolbars.edit._modes.edit.handler.enable()
      })

      document.getElementById('delete').addEventListener('click', function () {
        drawControl._toolbars.edit._modes.remove.handler.enable()
      })

      document.getElementById('save').addEventListener('click', function () {
        if (drawnItems.getLayers().length === 0) {
          alert('请先绘制隐私围栏')
          return
        }

        const geofences = []
        drawnItems.eachLayer(function (layer) {
          if (layer instanceof L.Polygon) {
            const coordinates = layer
              .getLatLngs()[0]
              .map((latlng) => [latlng.lat, latlng.lng])
            geofences.push({
              type: 'Feature',
              geometry: {
                type: 'Polygon',
                coordinates: [coordinates],
              },
              properties: {
                area: L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]),
              },
            })
          }
        })

        console.log('保存的围栏数据:', geofences)
        alert(`已保存 ${geofences.length} 个隐私围栏\n查看控制台获取数据`)

        // 这里可以添加AJAX请求将数据发送到服务器
        // fetch('/api/privacy-geofences', {
        //     method: 'POST',
        //     body: JSON.stringify(geofences)
        // });
      })

      // 更新坐标显示
      function updateCoordinates() {
        const layers = drawnItems.getLayers()
        let html = '<h3>当前隐私围栏</h3>'

        if (layers.length === 0) {
          html += '<p>没有围栏</p>'
        } else {
          layers.forEach((layer, index) => {
            if (layer instanceof L.Polygon) {
              const coordinates = layer
                .getLatLngs()[0]
                .map((latlng) => [latlng.lat, latlng.lng])
              const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0])

              html += `<div><strong>围栏 ${
                index + 1
              }</strong> (面积: ${area.toFixed(0)} m²)<br>`
              html += `坐标: ${JSON.stringify(coordinates)}</div><hr>`
            }
          })
        }

        document.getElementById('coordinates').innerHTML = html
      }

      // 初始化坐标显示
      updateCoordinates()
    </script>
  </body>
</html>
