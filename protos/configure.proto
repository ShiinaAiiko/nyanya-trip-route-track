syntax = "proto3";

option go_package = "./;protos";
package configure;

message Configure {
  message MapKey {
    string mapKey = 1;
    // Normal / Gray / Black / Dark
    string mapMode = 2;
  }
  message PolylineWidth {
    int64 ongoingTrip = 1;
    int64 historyTripTrack = 2;
    // 历史行程里选中的行程
    int64 historyTripTrackSelectedTrip = 3;
    int64 reviewTrip = 4;
  }
  message SpeedColorLimit {
    message SpeedColorLimitItem {
      double minSpeed = 1;
      double maxSpeed = 2;
    }
    SpeedColorLimitItem running = 1;
    SpeedColorLimitItem bike = 2;
    SpeedColorLimitItem drive = 3;
    SpeedColorLimitItem motorcycle = 4;
    SpeedColorLimitItem walking = 5;
    SpeedColorLimitItem powerwalking = 6;
    SpeedColorLimitItem plane = 7;
    SpeedColorLimitItem train = 8;
    SpeedColorLimitItem publictransport = 9;
  }
  message MapLayer {
    message MapLayerItem {
      string mapKey = 1;
      // Normal / Gray / Black / Dark
      string mapMode = 2;
      bool roadColorFade = 3;
      bool showAvatarAtCurrentPosition = 5;
      bool showSpeedColor = 6;
      bool cityName = 7;
      string cityBoundaries = 8;
      bool tripTrackRoute = 9;
      bool speedAnimation = 10;
      bool turnOnVoice = 11;
      bool showPositionMarker = 12;
      // RedGreen / PinkBlue
      string trackSpeedColor = 13;
      // Blue / Pink / Red
      string trackRouteColor = 14;
      int32 polylineWidth = 15;
      bool privacyGeofence = 16;
      bool headingUp = 17;
      bool carMode = 18;
      string filterSimilarTrips = 19;
      bool simplify = 20;
    }

    MapLayerItem indexPage = 1;
    MapLayerItem trackRoutePage = 2;
    MapLayerItem tripItemPage = 3;
    MapLayerItem journeyMemoriesPage = 4;
    MapLayerItem findLocationModal = 5;
    MapLayerItem createCustomTripModal = 6;
    MapLayerItem replayTripModal = 7;
    MapLayerItem visitedCitiesModal = 8;
    MapLayerItem privacyGeofenceModal = 9;
    MapLayerItem roadbookPage = 10;
  }

  MapLayer mapLayer = 1;

  message General {
    // Cloud
    SpeedColorLimit speedColorLimit = 1;

    bool enableGeoFence = 2;
    // Cloud
    // string trackSpeedColor = 4;
    // Cloud
    // string trackRouteColor = 5;
  }
  General general = 2;

  // Filter Local
  message Filter {
    message FilterItem {
      string startDate = 1;
      string endDate = 2;
      repeated string selectedVehicleIds = 3;
      // 仅trackRoute
      repeated string selectedTripTypes = 4;
      // 仅trackRoute Not stored
      repeated string selectedTripIds = 5;
      repeated string selectedJmIds = 6;
      // int64 shortestDistance = 6;
      // max ~100000km
      // int64 longestDistance = 7;

      bool showCustomTrip = 7;
      bool showFullData = 8;

      message RangeItem {
        int32 min = 1;
        int32 max = 2;
      }
      RangeItem distanceRange = 9;
      RangeItem speedRange = 10;
      RangeItem altitudeRange = 11;
    }
    // Local
    FilterItem tripHistory = 1;
    // Cloud
    FilterItem trackRoute = 2;
  }
  Filter filter = 3;

  message NavigationSettings {
    repeated string routeOptions = 1;
    string preference = 2;
    string travelOptions = 3;
  }
  // 导航习惯设置
  NavigationSettings navigation = 4;
  message AISettings {
    message AICoDriver {
      // 是否启用
      bool enabled = 1;
      bool autoPlayVoice = 2;
      int32 autoCloseTime = 3;

      // Live
      bool autoLaunchLiveAfterStartTrip = 4;
      // bool isVoiceInputAllowedInLive = 5;

      // 触发器

      message AICoDriverTrigger {
        // 里程触发 (单位: 米)
        int32 first_open_distance = 1; // 首次开启触发里程
        int32 milestone_step = 2;      // 里程步进触发间隔

        // 海拔与环境 (单位: 米/摄氏度)
        int32 altitude_step = 3;     // 海拔瞬时跳变阈值
        int32 climb_milestone = 4;   // 累计爬升触发阈值
        int32 descend_milestone = 5; // 累计下降触发阈值
        int32 temp_step = 6;         // 温差预警阈值

        // 驾驶行为与状态
        int32 speed_drop_threshold = 7;    // 速度骤降判定 (m/s)
        int32 min_movement_threshold = 8;  // 最小有效位移 (m)
        int32 rest_awake_threshold_ms = 9; // 重新出发判定时长 (ms)
        int32 drowsy_driving_ms = 10;      // 疲劳驾驶判定时长 (ms)

        // 策略控制
        int32 global_cooldown_ms = 11;     // 全局冷却时间 (ms)
        repeated int32 special_hours = 12; // 特殊时间点 (如 12, 18, 22)
      }
      AICoDriverTrigger trigger = 5;
    }
    AICoDriver aiCoDriver = 1;
  }
  AISettings ai = 7;
  int64 lastUpdateTime = 6;
  // Local
  //  bool roadColorFade = 11;

  // 谁新用谁

  // Local
  // MapKey baseMap = 2;
  // Local
  // MapKey trackRouteMap = 3;

  // Cloud
  // bool showAvatarAtCurrentPosition = 6;

  // Cloud
  //  PolylineWidth polylineWidth = 7;

  //  Local
  // bool speedAnimation = 9;
}

message GetConfigure {
  message Request {}
  message Response { Configure configure = 1; }
}

message SyncConfigure {
  message Request { Configure configure = 1; }
  message Response {}
}
