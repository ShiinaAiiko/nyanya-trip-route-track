syntax = "proto3";

option go_package = "./;protos";
package trip;
import "city.proto";
import "road.proto";

message VehicleItem {
  string id = 1;
  string name = 3;
  // Bike、Car、Truck、Public、Transportation、Airplane、Other
  string type = 2;
  string logo = 8;
  string licensePlate = 9;
  string authorId = 10;
  TripPosition position = 4;
  // 通过链表获取
  int64 tripCount = 11;

  string carModel = 13;

  // 1、-1
  int64 status = 5;
  int64 createTime = 6;
  int64 lastUpdateTime = 7;

  // 位置共享类型 5 所有人 0 仅本人可看 -1 禁止共享
  int64 positionShare = 12;
}

// 位置精度和海拔精度可以不输出，速度精确到小数点后2位即可，
// 也就是cm单位就行了，时间戳使用秒级单位数据，
// heading方向输出小数点后3位即可
message TripPosition {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;
  double altitudeAccuracy = 4;
  double accuracy = 5;
  double heading = 6;
  double speed = 7;
  int64 timestamp = 8;

  // 本地用
  double distance = 9;
}

// 每一个点的差值（除了第一个点是绝对值，后面全存相对前一个点的差值整数）
// 每个点对应数值都要乘以10xn，保证干掉小数点，后续再复原

message TripPositionOrigin {
  int64 latitude = 1;  // 绝对值
  int64 longitude = 2; // 绝对值
  int32 altitude = 3;  // 绝对值
  int32 altitudeAccuracy = 4;
  int32 accuracy = 5;
  int32 heading = 6;
  int32 speed = 7;
  int64 timestamp = 8; // 巨无霸毫秒/秒级时间戳，必须用 int64
}
message TripPositionDeltas {
  // 凡是可能出现正负交替的差值，无脑死磕 sint32，Protobuf 自动给小负数抽脂
  sint32 latitude = 1;
  sint32 longitude = 2;
  sint32 altitude = 3;
  sint32 altitudeAccuracy = 4;
  sint32 accuracy = 5;
  sint32 heading = 6;
  sint32 speed = 7;

  // 时间戳一秒一打，差值永远是正数（+差值秒），用普通的 int32 即可
  int64 timestamp = 8;
}

message TripPositionPayload {
  TripPositionOrigin originPoint = 1;
  repeated TripPositionDeltas position = 2;
}

message TripStatistics {
  double distance = 1;        // 本次行程距离 (m)
  double maxSpeed = 2;        // 最高速度 (m/s)
  double averageSpeed = 3;    // 平均时速 (m/s)
  double maxAltitude = 4;     // 最高海拔 (m)
  double minAltitude = 5;     // 最低海拔 (m)
  double averageAltitude = 6; // 平均海拔 (m)
  double climbAltitude = 7;   // 累计爬升高度 (m)
  double descendAltitude = 8; // 累计下降高度 (m)

  double totalElecCons = 9;  // 累计总耗电量 (单位：kWh 或 度)
  double totalFuelCons = 10; // 累计总耗油量 (单位：L 或 升)
}

message TripPermissions {
  bool allowShare = 1;
  bool customTrip = 2;
}

message TripMark { int64 timestamp = 1; }

message TripCity {
  string cityId = 1;
  //  完整名，·间隔
  string city = 2;

  message EntryTimeItem { int64 timestamp = 1; }
  repeated EntryTimeItem entryTimes = 3;
  // 仅输出
  repeated city.CityItem cityDetails = 4;
}

message TripRoad {
  repeated road.RoadInfo roads = 1;

  message EntryTimeItem { int64 timestamp = 1; }
  repeated EntryTimeItem entryTimes = 2;
  // 仅输出
  // repeated city.CityItem cityDetails = 4;
}

message TripWeather {
  int32 weatherCode = 1;
  double temperature = 2;
  double apparentTemperature = 3;
  double windSpeed = 4;
  int32 windDirection = 5;
  double humidity = 6;
  double precipitation = 7;

  // 只需要存储不同的时间即可
  int64 timestamp = 8;
}

message TripAddressesCity {
  string country = 1;
  string state = 2;
  string region = 3;
  string city = 4;
  string town = 5;
  string road = 6;
}
message TripAddressesAddress {
  string fullName = 1;
  string type = 6;
  string name = 7;
}

message TripAddresses {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;
  TripAddressesCity city = 4;
  TripAddressesAddress address = 5;
  int64 entryTime = 8;
}

message TripNetworkStatus {
  //  1 online; 2 offline'
  int32 status = 1;
  int64 timestamp = 2;
}

// 行驶瞬间数据（高频：车速、功率、转速等）
// 变化时存储
message TripDrivingSample {
  int64 timestamp = 1;      // 毫秒时间戳
  double speed = 2;         // 车速 km/h (×10, 精度 0.1)
  double power = 3;         // 功率 kW (×10, 精度 0.1)
  double rpm = 4;           // 发动机转速 (×10, 精度 0.1)
  double throttle = 6;      // 油门开度 % (×10, 精度 0.1)
  double brake = 7;         // 刹车开度 % (×10, 精度 0.1)
  double steeringAngle = 8; // 方向盘转角 (×10, 精度 0.1)
}

// 车辆状态快照（低频：温度、能耗、胎压等）
// 变化时存储（所有数据）
message TripVehicleState {
  int64 timestamp = 1; // 时间戳

  // 能量状态
  int32 batterySoc = 2;    // 电量 % (×10, 精度 0.1)
  int32 fuelLevel = 3;     // 油量 % (×10, 精度 0.1)
  int32 rangeElectric = 4; // 纯电续航 km (×10, 精度 0.1)
  int32 rangeFuel = 5;     // 燃油续航 km (×10, 精度 0.1)
  bool isCharging = 6;     // 充电中

  // 能耗数据
  double lastElectricConsumption = 21; // 电耗 kWh/50km (×10, 精度 0.1)
  double lastFuelConsumption = 22;     // 油耗 L/50km (×10, 精度 0.1)

  // 温度数据
  int32 outdoorTemp = 9; // 室外温度 ℃ (×10, 精度 0.1)
  int32 indoorTemp = 10; // 车内温度 ℃ (×10, 精度 0.1)

  // 累计数据
  double totalMileage = 16;        // 本次行程里程 km (×10, 精度 0.1)
  double evMileage = 17;           // 本次行程EV里程 km (×10, 精度 0.1)
  double electricConsumption = 23; // 本次电耗 (×10, 精度 0.1)
  double fuelConsumption = 24;     // 本次油耗 (×10, 精度 0.1)

  // 驾驶模式
  string driveMode = 19; // EV \ HEV \ ICE
}

// 存储在trip_car_data
message TripVehicleInfo {
  string vin = 4; // 车架号（可选）
}

// 存储SAaSS（参考GPS）
message TripVehicleData {
  TripVehicleInfo vehicleInfo = 1;        // 车辆静态信息
  repeated TripDrivingSample samples = 2; // 高频动态数据
  repeated TripVehicleState states = 3;   // 低频状态数据
}

// ================================================
// 车机数据增量压缩结构（用于存储和传输）
// ================================================

// 行驶样本原始点（第一个点，存绝对值）
message TripDrivingSampleOrigin {
  int64 timestamp = 1;     // 毫秒时间戳
  int32 speed = 2;         // 车速 ×10，精度 0.1 km/h
  int32 power = 3;         // 功率 ×10，精度 0.1 kW
  int32 rpm = 4;           // 转速 ×10，精度 0.1
  int32 throttle = 5;      // 油门 ×10，精度 0.1 %
  int32 brake = 6;         // 刹车 ×10，精度 0.1 %
  int32 steeringAngle = 7; // 方向盘转角 ×10，精度 0.1°
}

// 行驶样本差值点（后续点，存相对前一个点的差值）
message TripDrivingSampleDeltas {
  int64 timestampDelta = 1;      // 时间戳差值（毫秒）
  sint32 speedDelta = 2;         // 车速差值 ×10
  sint32 powerDelta = 3;         // 功率差值 ×10
  sint32 rpmDelta = 4;           // 转速差值 ×10
  sint32 throttleDelta = 5;      // 油门差值 ×10
  sint32 brakeDelta = 6;         // 刹车差值 ×10
  sint32 steeringAngleDelta = 7; // 转角差值 ×10
}

// 车辆状态原始点（第一个点，存绝对值）
message TripVehicleStateOrigin {
  int64 timestamp = 1;               // 时间戳
  int32 batterySoc = 2;              // 电量 ×10，精度 0.1 %
  int32 fuelLevel = 3;               // 油量 ×10，精度 0.1 %
  int32 rangeElectric = 4;           // 纯电续航 ×10，精度 0.1 km
  int32 rangeFuel = 5;               // 燃油续航 ×10，精度 0.1 km
  int32 isCharging = 6;              // 充电状态（0/1）
  int32 lastElectricConsumption = 7; // 电耗 ×10，精度 0.1
  int32 lastFuelConsumption = 8;     // 油耗 ×10，精度 0.1
  int32 outdoorTemp = 9;             // 室外温度 ×10，精度 0.1 ℃
  int32 indoorTemp = 10;             // 车内温度 ×10，精度 0.1 ℃
  int32 totalMileage = 11;           // 本次行程里程 ×10，精度 0.1 km
  int32 evMileage = 12;           // 本次行程EV里程 ×10，精度 0.1 km
  int32 electricConsumption = 13; // 本次电耗 ×10，精度 0.1
  int32 fuelConsumption = 14;     // 本次油耗 ×10，精度 0.1
}

// 车辆状态差值点（后续点，存相对前一个点的差值）
message TripVehicleStateDeltas {
  int64 timestampDelta = 1;                // 时间戳差值
  sint32 batterySocDelta = 2;              // 电量差值 ×10
  sint32 fuelLevelDelta = 3;               // 油量差值 ×10
  sint32 rangeElectricDelta = 4;           // 纯电续航差值 ×10
  sint32 rangeFuelDelta = 5;               // 燃油续航差值 ×10
  sint32 isChargingDelta = 6;              // 充电状态差值
  sint32 lastElectricConsumptionDelta = 7; // 电耗差值 ×10
  sint32 lastFuelConsumptionDelta = 8;     // 油耗差值 ×10
  sint32 outdoorTempDelta = 9;             // 室外温度差值 ×10
  sint32 indoorTempDelta = 10;             // 车内温度差值 ×10
  sint32 totalMileageDelta = 11;           // 行程里程差值 ×10
  sint32 evMileageDelta = 12;              // EV里程差值 ×10
  sint32 electricConsumptionDelta = 13;    // 电耗差值 ×10
  sint32 fuelConsumptionDelta = 14;        // 油耗差值 ×10
}

// 车机数据增量压缩容器
message TripVehicleDataPayload {
  TripVehicleInfo vehicleInfo = 1;             // 车辆静态信息
  TripDrivingSampleOrigin originSample = 2;    // 第一个行驶样本
  repeated TripDrivingSampleDeltas sample = 3; // 后续行驶样本差值
  TripVehicleStateOrigin originState = 4;      // 第一个车辆状态
  repeated TripVehicleStateDeltas state = 5;   // 后续车辆状态差值
}

message Trip {
  string id = 1;
  // 非必填
  string name = 2;
  // Running、Bike、Drive
  string type = 3;
  string authorId = 9;
  trip.VehicleItem vehicle = 14;
  // string vehicleId = 15;
  repeated TripPosition positions = 4;
  repeated TripAddresses addresses = 18;
  repeated TripNetworkStatus networkStatus = 19;
  repeated TripWeather weather = 20;
  TripVehicleData vehicleData = 21;
  TripStatistics statistics = 5;
  TripPermissions permissions = 11;
  // 1 normal 0 ing -1 delete
  int64 status = 6;
  int64 createTime = 7;
  int64 startTime = 10;
  int64 lastUpdateTime = 16;
  int64 endTime = 8;

  // web专属
  int64 correctedData = 12;

  repeated TripMark marks = 13;

  repeated TripCity cities = 15;
  repeated TripRoad roads = 17;
}

message AddTripMark {
  message Request {
    string id = 1;
    TripMark mark = 2;
  }
  message Response {}
}

message AddTrip {
  message Request {
    // Running、Bike、Drive
    string type = 1;
    // repeated TripPosition positions = 2;
    // int64 status = 4;
    // int64 startTime = 5;

    // 选填
    string vehicleId = 2;

    // 选填（自定义行程才填充
    bool customTrip = 3;
    int64 startTime = 4;
    int64 endTime = 5;
  }
  message Response { Trip trip = 1; }
}

message AddTripToOnline {
  message Request {
    // Running、Bike、Drive
    string type = 1;
    repeated TripPosition positions = 2;

    repeated TripMark marks = 8;

    repeated TripCity cities = 10;
    repeated TripRoad roads = 11;
    repeated TripNetworkStatus networkStatus = 12;
    repeated TripWeather weather = 13;

    // TripStatistics statistics = 3;
    // int64 status = 4;
    int64 createTime = 7;
    int64 startTime = 5;
    int64 endTime = 6;
    bool customTrip = 9;
  }
  message Response { Trip trip = 1; }
}

// 30s 更 新一次
message UpdateTripPosition {
  message Request {
    // 必填
    string id = 1;
    // 这段时间内的
    repeated TripPosition positions = 2;
    double distance = 3;
    string vehicleId = 4;
  }
  message Response {}
}

message ResumeTrip {
  message Request { string id = 1; }
  message Response {}
}

message FinishTrip {
  message Request {
    // 必填
    string id = 1;
    // TripStatistics statistics = 2;
    int64 endTime = 3;
  }
  message Response {
    bool deleted = 1;
    int32 positionLength = 2;
  }
}

message CorrectedTripData {
  message Request {
    // 必填
    string id = 1;
    // TripStatistics statistics = 2;
  }
  message Response {}
}

message UpdateTrip {
  message Request {
    // 必填
    string id = 1;
    // 可填，Allow / NotAllow
    string allowShare = 2;
    // 可填
    string name = 3;
    // 可填，Running、Bike、Drive
    string type = 4;
    // 选填
    string vehicleId = 5;
  }
  message Response {
    // 可填
    string name = 2;
  }
}

message UpdateTrips {
  message Request {
    // 必填
    repeated string ids = 1;
    // 选填
    string vehicleId = 5;
  }
  message Response {}
}

message DeleteTrip {
  message Request {
    // 必填
    string id = 1;
  }
  message Response {}
}

message GetTrip {
  message Request { string id = 1; }
  message Response { Trip trip = 1; }
}

message GetTripPositions {
  message Request {
    string id = 1;
    bool simplify = 2;
  }
  message Response {
    // 时间记得是输出秒，且输出与startTime相差多少s的数字即可
    // startTime为第一个position的时间戳
    TripPositions tripPositions = 1;
  }
}

message TripPositions {
  // 时间记得是输出秒，且输出与startTime相差多少s的数字即可
  // startTime为第一个position的时间戳
  int64 startTime = 1;
  // 禁止输出了一些数据，具体的看代码
  // repeated string positions = 2;
  bytes positions = 2;
  // repeated string keys = 8;
  int64 total = 3;
  string id = 4;
  string vehicleId = 9;
  string type = 5;
  // 详情页专属
  int64 status = 6;

  // web专属
  int64 correctedData = 7;

  string authorId = 8;

  // 仅前端输出
  repeated TripPosition positionList = 10;
  TripPermissions permissions = 11;
}

message GetTripHistoryPositions {
  message Request {
    // 必选 All、Running、Bike、Drive
    string type = 2;
    // 包括筛选，每次不能传入超过20个数据
    repeated string ids = 3;
    int64 pageNum = 4;
    int64 pageSize = 5;

    // 可选 [createTime,endTime]
    repeated int64 timeLimit = 6;
    repeated string vehicleLimit = 8;

    // bool fullData = 7;

    string jmId = 9;
    // 启用服务端精简数据
    bool simplify = 10;
  }
  message Response {
    repeated TripPositions list = 1;
    int64 total = 2;
  }
}

message GetTrips {
  message Request {
    // 可选
    repeated string id = 1;
    // 必选 All、Running、Bike、Drive
    string type = 2;
    // 可选 [createTime,endTime]
    repeated int64 createTimeLimit = 3;
    // 可选 [startTime,endTime]
    repeated int64 lastUpdateTimeLimit = 9;
    // 可选 CreateTime / TotalDistance，默认 CreateTime
    string sort = 4;
    int64 pageNum = 5;
    int64 pageSize = 6;
    repeated string vehicleLimit = 7;
    repeated string journeyMemoryLimit = 10;
    repeated int64 distanceLimit = 8;

    bool turnOffCache = 11;
    // repeated int64 distanceLimit = 7;
  }
  message Response {
    repeated Trip list = 1;
    int64 total = 2;
  }
}

message GetTripStatistics {
  message Request {
    // 可选
    repeated string id = 1;
    // 必选 Running、Bike、Drive
    string type = 2;
    // 可选 [createTime,endTime]
    repeated int64 timeLimit = 3;
    repeated string vehicleLimit = 4;
    repeated string journeyMemoryLimit = 6;
    repeated int64 distanceLimit = 5;
    // int64 pageNum = 6;
    // int64 pageSize = 7;

    // 可选 CreateTime / TotalDistance，默认 CreateTime

    // repeated int64 distanceLimit = 4;
  }
  message Response {
    trip.TripHistoricalStatistics statistics = 1;
    // int32 count = 1;
    // // s
    // int64 time = 2;
    // // m
    // double distance = 3;
    // int32 days = 4;
    //
    // // repeated Trip list = 4;
    // repeated string uselessData = 5;
  }
}

message TripHistoricalStatistics {
  int32 count = 1;
  int64 time = 2;
  double distance = 3;
  int32 days = 4;
  repeated string uselessData = 12;

  message NumItem {
    double num = 1;
    string id = 2;
  }
  NumItem maxDistance = 5;
  NumItem maxSpeed = 6;
  NumItem fastestAverageSpeed = 7;
  NumItem maxAltitude = 8;
  NumItem minAltitude = 9;
  NumItem maxClimbAltitude = 10;
  NumItem maxDescendAltitude = 11;
  NumItem maxTotalTripDuration = 13;
  NumItem maxDrivingDuration = 14;
}

