syntax = "proto3";

option go_package = "./;protos";
package journeyMemory;
import "trip.proto";

message JourneyMemoryTimelinePriceItem {
  string id = 1;            // 唯一标识
  string name = 2;          // 项目名（如 "住宿费"、"加油费"）
  double amount = 3;        // 金额
  double actualAmount = 13; // 实付金额（实际支付的钱）
  string currency = 4;      // 金额单位（CNY, USD, EUR, JPY 等）
  // 类别（如 "住宿"、"交通"、"餐饮"、"门票"），非预设则是自定义
  string category = 5;
  string desc = 7; // 备注/描述
  int64 time = 8;  // 消费时间
  // repeated JourneyMemoryMediaItem media = 10; // 关联的媒体文件
  // ID（如票据照片）
  int64 createTime = 11;     // 创建时间
  int64 lastUpdateTime = 12; // 最后更新时间
}

// JourneyMemoryTimeLineIMediaItem 表示媒体项
message JourneyMemoryMediaItem {
  string type = 1; // "image", "video", etc.
  string url = 2;
  int32 width = 3;
  int32 height = 4;
}

// JourneyMemoryTimeLineItem 表示时间线中的一个条目
message JourneyMemoryTimelineItem {
  string id = 7;
  string name = 1;
  string desc = 2;
  repeated JourneyMemoryMediaItem media = 3; // 媒体项数组
  repeated string tripIds = 4;               // 旅行 ID 数组
  int64 time = 5;                            // 时间戳
  // 仅输出用
  trip.TripHistoricalStatistics statistics = 6;
  repeated trip.Trip trips = 8;
  repeated JourneyMemoryTimelinePriceItem prices = 9; // 价格列表
  repeated string tags = 10;                          // 标签
}

message JourneyMemoryPermissions { bool allowShare = 1; }

message JourneyMemoryItem {
  string id = 1;
  string name = 2;
  string desc = 3;
  repeated JourneyMemoryMediaItem media = 11;

  repeated JourneyMemoryTimelineItem timeline = 4;

  JourneyMemoryPermissions permissions = 12;

  string authorId = 9;
  // 1、-1
  int32 status = 5;
  int64 createTime = 6;
  int64 lastUpdateTime = 7;
  int64 deleteTime = 8;

  // 绑定的记账本 ID（用于以账本统一记账，代替时间线里的 prices）
  string ledgerBookId = 13;

  // 仅输出用
  trip.TripHistoricalStatistics statistics = 10;
}

message AddJM {
  message Request {
    string name = 1;
    string desc = 2;
    repeated JourneyMemoryMediaItem media = 3;
    // 绑定的记账本 ID（可选）
    string ledgerBookId = 4;
  }
  message Response { JourneyMemoryItem journeyMemory = 1; }
}

message UpdateJM {
  message Request {
    string id = 1;
    string name = 2;
    string desc = 3;
    repeated JourneyMemoryMediaItem media = 4;
    // Allow / NotAllow
    string allowShare = 5;
    // 绑定的记账本 ID（非空则更新）
    string ledgerBookId = 6;
  }
  message Response {}
}

message GetJMDetail {
  message Request {
    string id = 1;
    // bool allowShare = 2;
  }
  message Response { JourneyMemoryItem journeyMemory = 1; }
}

message GetJMList {
  message Request {
    int32 pageNum = 1;
    int32 pageSize = 2;
    // 为空则全部，否则筛选
    repeated string fields = 3;
    bool simplifiedData = 4;
  }
  message Response {
    repeated JourneyMemoryItem list = 1;
    int32 total = 2;
  }
}

message DeleteJM {
  message Request { string id = 1; }
  message Response {}
}

message AddJMTimeline {
  message Request {
    string id = 6;
    string name = 1;
    string desc = 2;
    repeated JourneyMemoryMediaItem media = 3;          // 媒体项数组
    repeated string tripIds = 4;                        // 旅行 ID 数组
    repeated JourneyMemoryTimelinePriceItem prices = 7; // 价格列表
    repeated string tags = 8;                           // 标签
    int64 time = 5;                                     // 时间戳
  }
  message Response { JourneyMemoryTimelineItem journeyMemoryTimeline = 1; }
}

message UpdateJMTimeline {
  message Request {
    string id = 6;
    string timelineId = 7;
    string name = 1;
    string desc = 2;
    repeated JourneyMemoryMediaItem media = 3;          // 媒体项数组
    repeated string tripIds = 4;                        // 旅行 ID 数组
    repeated JourneyMemoryTimelinePriceItem prices = 8; // 价格列表
    repeated string tags = 9;                           // 标签
    int64 time = 5;                                     // 时间戳
  }
  message Response {}
}

message GetJMTimelineList {
  message Request {
    string id = 1;
    int32 pageNum = 2;
    int32 pageSize = 3;
    // string shareKey = 4;
  }
  message Response {
    repeated JourneyMemoryTimelineItem list = 1;
    int32 total = 2;
  }
}

message DeleteJMTimeline {
  message Request {
    string id = 1;
    string timelineId = 2;
  }
  message Response {}
}